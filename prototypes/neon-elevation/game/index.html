<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05030d">
<title>NEON ELEVATION</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    height:100%;background:#05030d;overflow:hidden;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;touch-action:none;
    overscroll-behavior:none;
  }
  #wrap{
    position:fixed;inset:0;display:grid;place-items:center;
    padding:env(safe-area-inset-top) env(safe-area-inset-right)
            env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;touch-action:none}
</style>
</head>
<body>
  <div id="wrap"><canvas id="screen"></canvas></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
